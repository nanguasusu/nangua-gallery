name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        working-directory: .
        run: npm ci
      - name: Typecheck
        working-directory: .
        run: npm run typecheck
      - name: Lint
        working-directory: .
        run: npm run lint
      - name: Test
        working-directory: .
        run: npm test
      - name: Build web
        working-directory: .
        run: npm run build -w @nangua/web
      - name: Check token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is set"
      - name: Apply D1 migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "434bb94329168bc60e22384a60c2785c"
        run: npx wrangler d1 migrations apply nangua-gallery --remote
      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "434bb94329168bc60e22384a60c2785c"
        run: npx wrangler deploy
